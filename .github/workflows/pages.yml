# Robot del catálogo + publicación de web/ en GitHub Pages (rinbo.store).
# Requiere: Settings → Pages → Source = "GitHub Actions".
#
# 1) "catalogo": lee la planilla (CSV publicado) y las fotos de Google Drive, y rearma el sitio con
#    web-plantillas/armar.py --catalogo (páginas de productos y categorías, fotos WebP, sitemap.xml,
#    feed de Google Merchant). Si algo cambió, lo guarda con un commit en la misma rama.
# 2) "publicar": solo en main, sube web/ a GitHub Pages.
#
# Corre: cada hora, en cada push a main que toque el sitio, y a mano con "Run workflow"
# (Actions → este workflow → Run workflow; se puede elegir otra rama para verla en la vista previa de Cloudflare).
# Los commits que hace el robot no vuelven a disparar este workflow (así no se repite en bucle).
name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', 'web-plantillas/**', '.github/workflows/pages.yml']
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  catalogo:
    runs-on: ubuntu-latest
    outputs:
      cambio: ${{ steps.guardar.outputs.cambio }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Pillow (fotos WebP)
        run: pip install --quiet pillow
      - name: Leer la planilla y rearmar el sitio
        run: python3 web-plantillas/armar.py --catalogo
      - name: Guardar cambios (si hay)
        id: guardar
        run: |
          git add -A web web-plantillas/estado-catalogo.json
          if git diff --cached --quiet; then
            echo "Sin cambios en la planilla."
            echo "cambio=no" >> "$GITHUB_OUTPUT"
          else
            git config user.name "rinbo-robot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --quiet -m "Catálogo: actualizar desde la planilla"
            git push
            echo "cambio=si" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: catalogo
    # En main: publica si cambió el catálogo, si hubo un push o si se corrió a mano (no cada hora sin cambios)
    if: github.ref == 'refs/heads/main' && (needs.catalogo.outputs.cambio == 'si' || github.event_name != 'schedule')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}  # incluye el commit que acaba de hacer el robot
      - name: Comprobar que web/ tiene la portada
        run: test -f web/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
